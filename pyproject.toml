[project]
name = "yt2class"
version = "0.1.0"
description = "Turn YouTube course videos into source-faithful PPTX lecture notes."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "Pillow>=10.0",
  "pydantic>=2.8",
  "scenedetect[opencv]>=0.6.6",
  "typer>=0.12",
]

[project.scripts]
yt2class = "yt2class.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt2class"]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: real network/YouTube/summarize runs; not part of ordinary contract tests",
  "artifact_tool: prototype PPTX tests that need the Codex Artifact Tool helper",
]
