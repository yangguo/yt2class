<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>yt2class review</title>
  <style>
    body { font-family: sans-serif; margin: 1.5rem; color: #111; }
    .banner { padding: 0.75rem 1rem; margin-bottom: 1rem; border-radius: 6px; }
    .banner.draft { background: #fef3c7; }
    .banner.evidence-only { background: #e5e7eb; }
    .banner.strict { background: #d1fae5; }
    .badge { display: inline-block; padding: 0.1rem 0.45rem; border-radius: 4px; font-size: 0.8rem; margin-right: 0.4rem; }
    .badge-draft { background: #f59e0b; color: #111; }
    .badge-evidence-only { background: #4b5563; color: #fff; }
    .badge-verified { background: #059669; color: #fff; }
    article { border: 1px solid #d1d5db; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    img { max-width: 100%; height: auto; background: #f3f4f6; }
    .warn { font-weight: 600; }
    ul { padding-left: 1.2rem; }
  </style>
</head>
<body>
  <h1>离线审阅 / review</h1>
  <p class="warn">Draft / evidence-only 材料有可见标识，不能伪装成已核验结论。模型互审不是通过依据。</p>
  <div id="banner"></div>
  <section id="privacy"></section>
  <section id="omissions"></section>
  <section id="pages"></section>
  <script id="review-bundle" type="application/json">__REVIEW_BUNDLE_JSON__</script>
  <script>
    function safeLink(value) {
      const text = String(value || "");
      if (/^https:\/\/www\.youtube\.com\/watch\?v=[A-Za-z0-9_-]+&t=\d+s$/.test(text)) return text;
      if (/^t=\d+s$/.test(text)) return text;
      return "";
    }
    function safeImg(value) {
      const text = String(value || "");
      if (/^(?!\/)(?!.*[:\\])(?!.*(?:^|\/)\.\.(?:\/|$))[A-Za-z0-9._/-]+\.(?:jpg|jpeg|png|webp)$/i.test(text)) {
        return text;
      }
      return "";
    }
    function addText(node, tag, text) {
      const child = document.createElement(tag);
      child.textContent = text;
      node.appendChild(child);
      return child;
    }
    const bundle = JSON.parse(document.getElementById("review-bundle").textContent);
    const banner = document.getElementById("banner");
    const mode = (bundle.report && bundle.report.quality_mode) || "draft";
    banner.className = "banner " + mode;
    banner.textContent = "quality_mode=" + mode + " revision=" + bundle.revision +
      (bundle.report && bundle.report.human_sampling_required ? " · 需要人工抽样核验" : "");
    const privacy = document.getElementById("privacy");
    if (bundle.media_privacy) {
      addText(privacy, "h2", "媒体上传与隐私");
      const mp = bundle.media_privacy;
      addText(privacy, "p", mp.summary || "");
      addText(privacy, "p", "media_uploaded=" + String(mp.media_uploaded) + " mode=" + mp.analysis_mode);
      const uploadList = document.createElement("ul");
      (mp.uploads || []).forEach((row) => {
        const range = row.source_range || {};
        const text = (row.upload_id || "") + " " + (row.state || "") + " [" +
          range.start_seconds + "s," + range.end_seconds + "s] retention=" +
          (row.retention_policy || "") + " video_s=" + (row.usage_video_seconds || 0);
        addText(uploadList, "li", text);
      });
      privacy.appendChild(uploadList);
    }
    const omit = document.getElementById("omissions");
    addText(omit, "h2", "遗漏主题");
    const omitList = document.createElement("ul");
    (bundle.omitted_topics || []).forEach((item) => {
      addText(omitList, "li", String(item));
    });
    omit.appendChild(omitList);
    const root = document.getElementById("pages");
    (bundle.pages || []).forEach((view) => {
      const page = view.page || {};
      const label = page.quality_label || "draft";
      const article = document.createElement("article");
      const heading = document.createElement("h2");
      const badge = document.createElement("span");
      badge.className = "badge badge-" + label.replace(/[^a-z-]/g, "");
      badge.textContent = label;
      heading.appendChild(badge);
      heading.appendChild(document.createTextNode(page.title || ""));
      article.appendChild(heading);
      addText(article, "p", page.notes || "");
      addText(article, "p", "claims: " + (view.claim_texts || []).join(" / "));
      addText(article, "p", "transcript: " + (view.transcript_excerpts || []).join(" / "));
      const links = document.createElement("p");
      links.appendChild(document.createTextNode("time links: "));
      (view.time_links || []).forEach((link, index) => {
        const href = safeLink(link);
        if (!href) return;
        if (index) links.appendChild(document.createTextNode(" · "));
        const anchor = document.createElement("a");
        anchor.setAttribute("href", href);
        anchor.textContent = href;
        links.appendChild(anchor);
      });
      article.appendChild(links);
      (view.frame_asset_paths || []).forEach((src) => {
        const safe = safeImg(src);
        if (!safe) return;
        const image = document.createElement("img");
        image.setAttribute("alt", "source frame");
        image.setAttribute("src", safe);
        article.appendChild(image);
      });
      root.appendChild(article);
    });
  </script>
</body>
</html>
